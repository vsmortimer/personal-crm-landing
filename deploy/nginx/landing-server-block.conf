# Reference copy of the landing's HTTPS server block from /etc/nginx/sites-available/crm.conf.
# crm.conf itself is written by the server-setup.sh script of the app repo; only the marked
# include line below was added for the landing. Other blocks in that file are not ours.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example-crm.site;
    include /etc/nginx/snippets/crm-tls.conf;
    root /var/www/example-crm.site;
    include /etc/nginx/snippets/crm-landing-security.conf;  # added: security headers
    index index.html;
    location / { try_files $uri $uri/ =404; }
}
