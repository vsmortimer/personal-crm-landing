# Reference copy of the two server blocks of /etc/nginx/sites-available/crm.conf that serve the landing.
# crm.conf itself is written by the server-setup.sh script of the app repo; only the lines marked
# "added" were put in for the landing by apply-landing-security.sh. Other blocks in that file are not ours.

# Port 80: redirect to https. Shared with the app name, so only the version header is changed here.
server {
    listen 80;
    listen [::]:80;
    server_name example-crm.site app.example-crm.site;
    server_tokens off;  # added: hide the nginx version on the redirect
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

# Port 443: the landing itself
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example-crm.site;
    include /etc/nginx/snippets/crm-tls.conf;
    root /var/www/example-crm.site;
    include /etc/nginx/snippets/crm-landing-security.conf;  # added: security headers
    index index.html;
    location / { try_files $uri $uri/ =404; }
}
