# Security headers for the landing (example-crm.site) only.
# On the server: /etc/nginx/snippets/crm-landing-security.conf, included from the landing
# server block in /etc/nginx/sites-available/crm.conf (see landing-server-block.conf).
# The app (app.example-crm.site) and the test stand have their own blocks and are not touched.
#
# add_header is inherited by a location only if that location has no add_header of its own.
# The landing has no such location; if one appears, include this file there as well.

# Hide the nginx version (Server header and error pages) for this site
server_tokens off;

# One year, https only. No includeSubDomains: the app and the stand are separate sites
add_header Strict-Transport-Security "max-age=31536000" always;

# No nonce: inline scripts and styles stay allowed ('unsafe-inline'), the page is not changed.
# Everything else comes only from the site itself; nobody may embed the page in a frame.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

# Same ban on frames for old browsers that ignore frame-ancestors
add_header X-Frame-Options "DENY" always;

add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
